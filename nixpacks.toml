buildImage = 'ghcr.io/railwayapp/nixpacks:latest'

[phases.setup]
  nixpkgsArchive = '51ad838b03a05b1de6f9f2a0fffecee64a9788ee'

[phases.install]
cmds = ["corepack enable", "corepack prepare pnpm@10.33.0 --activate", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "node build"
